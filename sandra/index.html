<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#FAF8F4" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0F172A" media="(prefers-color-scheme: dark)">
  <!-- Set the theme before first paint (no flash). Saved choice wins, else the OS setting. -->
  <script>
    (function () {
      try { var m = localStorage.getItem("sa-theme"); } catch (e) {}
      document.documentElement.dataset.theme = m || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.classList.add("js");
    })();
  </script>
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..600;1,9..144,400..500&family=Inter:wght@400..600&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="assets/css/styles.css">
  <title>Sandra Abrafi | Data Analyst Portfolio</title>
  <meta name="description" content="Sandra Abrafi is a Data Analyst who turns raw data into decisions people act on, with SQL, Power BI, Python and clear storytelling. Case studies, toolkit and contact.">
  <link rel="canonical" href="https://koduahkk.github.io/sandra/">
  <meta name="author" content="Sandra Abrafi">

  <!-- Open Graph / Twitter -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://koduahkk.github.io/sandra/">
  <meta property="og:title" content="Sandra Abrafi | Data Analyst Portfolio">
  <meta property="og:description" content="I turn raw data into decisions people act on.">
  <meta property="og:image" content="https://koduahkk.github.io/sandra/assets/img/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Sandra Abrafi, Data Analyst. I turn raw data into decisions people act on.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Sandra Abrafi | Data Analyst Portfolio">
  <meta name="twitter:description" content="I turn raw data into decisions people act on.">
  <meta name="twitter:image" content="https://koduahkk.github.io/sandra/assets/img/og-image.png">
  <!-- JSON-LD Person schema is generated from data.js by home.js -->
</head>
<body>
  <header id="site-header"></header>

  <main id="main" tabindex="-1">
    <noscript>
      <div class="container noscript">
        <h1>Sandra Abrafi, Data Analyst</h1>
        <p>This portfolio uses JavaScript to render its content and charts. Please enable it to see the case studies.</p>
      </div>
    </noscript>
  </main>

  <footer id="site-footer"></footer>

  <!-- Content first, then shared UI, then the page script. -->
  <script src="assets/js/data.js" defer></script>
  <script src="assets/js/ui.js" defer></script>
  <script src="assets/js/home.js" defer></script>
</body>
</html>
