<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{page.title}}</title>
<meta name="description" content="{{page.description}}">
<link rel="canonical" href="{{page.canonical}}">
<meta name="theme-color" content="#F5F2EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E0E0C" media="(prefers-color-scheme: dark)">

<!-- Open Graph / social -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="NeverMissed">
<meta property="og:title" content="{{page.title}}">
<meta property="og:description" content="{{page.description}}">
<meta property="og:url" content="{{page.canonical}}">
<meta property="og:image" content="{{page.ogImage}}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

<link rel="icon" href="{{root}}assets/img/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="{{root}}assets/img/apple-touch-icon.png">

<!-- Fonts: display=swap + metric-matched fallbacks in tokens.css keep layout shift near zero -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap">

<link rel="stylesheet" href="{{root}}assets/css/tokens.css">
<link rel="stylesheet" href="{{root}}assets/css/main.css">
<script>
  document.documentElement.classList.add('js');
  // Every page load (including a refresh, also inside embedded previews) starts
  // at the top. Exception: a link to a #section on a fresh visit still jumps there.
  // Re-applied briefly after load to beat any restored scroll position, and
  // abandoned as soon as the visitor scrolls on their own.
  (function () {
    try {
      if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
      var nav = performance.getEntriesByType && performance.getEntriesByType('navigation')[0];
      var isReload = nav && nav.type === 'reload';
      if (location.hash && location.hash.length > 1 && !isReload) return;
      var userMoved = false;
      var stop = function () { userMoved = true; };
      ['wheel', 'touchstart', 'keydown', 'mousedown'].forEach(function (t) { window.addEventListener(t, stop, { passive: true, once: true }); });
      var top = function () { if (!userMoved && window.scrollY !== 0) window.scrollTo({ top: 0, left: 0, behavior: 'instant' }); };
      top();
      document.addEventListener('DOMContentLoaded', top);
      window.addEventListener('load', function () { [0, 100, 300, 700, 1200].forEach(function (ms) { setTimeout(top, ms); }); });
    } catch (e) { /* very old browsers: keep the default behaviour */ }
  })();
</script>
<script src="{{root}}assets/js/main.js" defer></script>
{{page.schema}}
