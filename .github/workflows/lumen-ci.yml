name: Lumen CI

on:
  push:
    paths: ["lumen/**", ".github/workflows/lumen-ci.yml"]
  pull_request:
    paths: ["lumen/**", ".github/workflows/lumen-ci.yml"]

permissions:
  contents: read

concurrency:
  group: lumen-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: lumen

jobs:
  test:
    name: Tests (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: lumen/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: lumen/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: lumen
      - name: Linux system libraries
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:config
      - run: pnpm typecheck
      - run: pnpm --filter @lumen/desktop build:web
      - name: Web build committed for GitHub Pages is up to date
        run: |
          pnpm --filter @lumen/desktop build:pages
          git diff --exit-code -- app || (echo "::error::lumen/app is stale - run pnpm --filter @lumen/desktop build:pages and commit" && exit 1)
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: pnpm test
      - run: pnpm --filter @lumen/desktop exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  platform-check:
    name: Check ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: lumen/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: lumen/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: lumen
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @lumen/desktop build:web
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test -p lumen-core

  audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: lumen/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm audit --prod --audit-level high
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # Fails on vulnerabilities; unmaintained/unsound notices are reported as warnings.
      - run: cargo audit
