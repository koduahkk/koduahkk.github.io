<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page not found | Kingsley Koduah</title>
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#F5F2EC">
    <link rel="icon" type="image/png" href="/favicon-32x32.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,600;0,700;0,800;0,900;1,800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/style.css">
    <script>
        // Every load and refresh starts at the top. A fresh visit to a #section link still jumps there.
        // Re-applied briefly after load (to beat restored scroll positions), and dropped as soon as the visitor scrolls.
        (function () {
            try {
                if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
                var nav = performance.getEntriesByType && performance.getEntriesByType('navigation')[0];
                var isReload = nav && nav.type === 'reload';
                if (location.hash.length > 1 && !isReload) return;
                var moved = false;
                ['wheel', 'touchstart', 'keydown', 'mousedown'].forEach(function (t) { window.addEventListener(t, function () { moved = true; }, { passive: true, once: true }); });
                var top = function () { if (!moved && window.scrollY !== 0) window.scrollTo({ top: 0, left: 0, behavior: 'instant' }); };
                if (isReload && location.hash) history.replaceState(null, '', location.pathname + location.search);
                top();
                document.addEventListener('DOMContentLoaded', top);
                window.addEventListener('load', function () { [0, 100, 300, 700, 1200].forEach(function (ms) { setTimeout(top, ms); }); });
            } catch (e) {}
        })();
    </script>
</head>
<body>
<main class="container not-found">
    <p class="section-eyebrow">Error 404</p>
    <h1 class="section-title">This page is <span class="lime">an outlier.</span></h1>
    <p>The link may be old, or the page has moved. Everything worth seeing is one click away.</p>
    <div class="hero-actions">
        <a href="/" class="btn btn-lime">Back to the portfolio <span aria-hidden="true">→</span></a>
        <a href="/#projects" class="btn btn-ghost">See the projects</a>
    </div>
</main>
</body>
</html>
